name: Build Windows installer

# Este workflow compila el instalador de Windows (.msi y .exe/NSIS) usando un runner de
# GitHub con Windows real, porque el entorno donde se generó este proyecto no tiene acceso
# de red al toolchain de Rust para Windows y no puede compilar el .exe directamente.
#
# Cómo usarlo:
#   1. Sube esta carpeta completa a un repositorio de GitHub (puede ser privado).
#   2. Ve a la pestaña "Actions" del repositorio.
#   3. Selecciona "Build Windows installer" y presiona "Run workflow".
#   4. Cuando termine (unos 8-12 minutos), entra a la ejecución y descarga el artefacto
#      "mi-botica-windows-installer" — ahí están el .msi y el instalador .exe (NSIS).
#
# También se dispara automáticamente si subes una etiqueta (tag) que empiece con "v",
# por ejemplo: git tag v1.0.0 && git push origin v1.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Instalar dependencias de Node
        run: npm install

      - name: Compilar la app y generar el instalador
        run: npm run tauri build

      - name: Subir instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-botica-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
